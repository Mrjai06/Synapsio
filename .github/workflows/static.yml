name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Build
        run: bun run build
      # There used to be a "Copy index.html to 404.html for SPA routing" step here. It was correct
      # for the old React SPA, which resolved unknown paths client-side. Astro pre-renders every
      # route, so the copy only meant that any wrong URL served the German homepage under a 404
      # status. src/pages/404.astro replaces it and Astro emits dist/404.html itself; this step
      # guards against that file quietly disappearing.
      - name: Verify the 404 page was built
        run: test -s dist/404.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
